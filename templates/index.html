{% extends "base.html" %}
{% block content %}
  <h1>最新文章</h1>
  {% for post in posts %}
  <article class="post-preview">
    <h2><a href="{{ url_for('post', slug=post.slug) }}">{{ post.title }}</a></h2>
    <p class="meta">{{ post.date }}</p>
    <p>{{ post.summary }}</p>
  </article>
  {% else %}
  <p>还没有文章。</p>
  {% endfor %}
{% endblock %}
